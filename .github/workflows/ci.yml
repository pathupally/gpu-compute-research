name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make verify
      - run: make analysis
      - run: git diff --exit-code

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - run: make all
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: output/pdf/the-benchmark-is-part-of-the-option.pdf
