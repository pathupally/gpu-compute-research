name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: make verify
      - run: make analysis
      - run: git diff --exit-code

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - run: make all
      # The compiled PDF is deliberately excluded from the byte-identity gate.
      # SOURCE_DATE_EPOCH pins timestamps, but the pdfTeX version banner and
      # font subsetting differ between TinyTeX and Ubuntu texlive, so the
      # binary can never match across distributions. Everything the PDF is
      # built FROM -- paper/generated/*.tex, carrying every reported number --
      # is still gated here, and the test jobs gate the analysis in full.
      - run: git diff --exit-code -- . ':!outputs/pdf'
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript
          path: outputs/pdf/the-benchmark-is-part-of-the-option.pdf
